<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Project Management Tool</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef2f7;
        }

        .login-box {
            width: 400px;
            max-width: 90%;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
            text-align: center;
        }

        .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        h1 {
            color: #2563eb;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 25px;
        }

        label {
            display: block;
            text-align: left;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 7px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 7px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        #message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
        }

        .register {
            margin-top: 20px;
            color: #555;
        }

        .register a {
            color: #2563eb;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="login-box">

    <div class="icon">📋</div>

    <h1>Welcome Back</h1>

    <p class="subtitle">
        Login to Project Management Tool
    </p>

    <form id="loginForm">

        <label for="email">
            Email
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">
            🔐 Login
        </button>

    </form>

    <div id="message"></div>

    <p class="register">
        Don't have an account?
        <a href="/register">Register</a>
    </p>

</div>


<script>

const loginForm =
    document.getElementById("loginForm");

const message =
    document.getElementById("message");


loginForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();

        const email =
            document.getElementById(
                "email"
            ).value.trim();

        const password =
            document.getElementById(
                "password"
            ).value;

        message.textContent =
            "Logging in...";

        message.style.color =
            "#2563eb";

        try {

            const response =
                await fetch(
                    "/api/login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            email: email,
                            password: password
                        })
                    }
                );

            const data =
                await response.json();

            if (!response.ok) {

                message.textContent =
                    "❌ " + data.message;

                message.style.color =
                    "#dc2626";

                return;
            }

            message.textContent =
                "✅ Login successful!";

            message.style.color =
                "#16a34a";

            // Dashboard open karo
            setTimeout(function() {

                window.location.href =
                    "/project.html";

            }, 500);

        } catch (error) {

            console.error(error);

            message.textContent =
                "❌ Server connection error.";

            message.style.color =
                "#dc2626";
        }

    }
);

</script>

</body>
</html>
